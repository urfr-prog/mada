<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ═══ ICÔNES — dessin Canvas2D direct ═══
// Chaque fonction dessine dans un ctx, centré sur (cx,cy), taille ~sz
// Couleur néon cyan

function drawIcon(ctx, iconIdx, cx, cy, sz, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = sz * 0.08;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = sz * 0.25;
    const h = sz * 0.4, w = sz * 0.4;

    switch(iconIdx) {
        case 0: // chevronUp
            ctx.beginPath();
            ctx.moveTo(cx-w, cy+h*0.5); ctx.lineTo(cx, cy-h*0.5); ctx.lineTo(cx+w, cy+h*0.5);
            ctx.stroke(); break;
        case 1: // chevronDown
            ctx.beginPath();
            ctx.moveTo(cx-w, cy-h*0.5); ctx.lineTo(cx, cy+h*0.5); ctx.lineTo(cx+w, cy-h*0.5);
            ctx.stroke(); break;
        case 2: // circle
            ctx.beginPath();
            ctx.arc(cx, cy, sz*0.28, 0, Math.PI*2);
            ctx.stroke(); break;
        case 3: // twoCircles
            ctx.beginPath(); ctx.arc(cx-w*0.45, cy, sz*0.18, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx+w*0.45, cy, sz*0.18, 0, Math.PI*2); ctx.stroke();
            break;
        case 4: // line
            ctx.beginPath(); ctx.moveTo(cx-w, cy); ctx.lineTo(cx+w, cy);
            ctx.stroke(); break;
        case 5: // threeLines
            ctx.beginPath(); ctx.moveTo(cx-w*0.5, cy-h); ctx.lineTo(cx-w*0.5, cy+h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy-h); ctx.lineTo(cx, cy+h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx+w*0.5, cy-h); ctx.lineTo(cx+w*0.5, cy+h); ctx.stroke();
            break;
        case 6: // twoPoints
            ctx.beginPath(); ctx.arc(cx-w*0.45, cy, sz*0.09, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+w*0.45, cy, sz*0.09, 0, Math.PI*2); ctx.fill();
            break;
        case 7: // threePoints
            ctx.beginPath(); ctx.arc(cx, cy-h*0.5, sz*0.09, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx-w*0.55, cy+h*0.45, sz*0.09, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+w*0.55, cy+h*0.45, sz*0.09, 0, Math.PI*2); ctx.fill();
            break;
        case 8: // waveUp
            ctx.beginPath();
            ctx.moveTo(cx-w, cy+h*0.3);
            ctx.quadraticCurveTo(cx-w*0.3, cy-h, cx, cy);
            ctx.quadraticCurveTo(cx+w*0.3, cy+h, cx+w, cy-h*0.3);
            ctx.stroke(); break;
        case 9: // waveDown
            ctx.beginPath();
            ctx.moveTo(cx-w, cy-h*0.3);
            ctx.quadraticCurveTo(cx-w*0.3, cy+h, cx, cy);
            ctx.quadraticCurveTo(cx+w*0.3, cy-h, cx+w, cy+h*0.3);
            ctx.stroke(); break;
    }
    ctx.restore();
}

// ═══ DOMINO TEXTURE — médiane verticale, néon, tout Canvas2D ═══

const _dtc = {};
function getDominoTex(leftIdx, rightIdx, tint, noIcons) {
    const k = leftIdx+'|'+rightIdx+'|'+tint+(noIcons?'|empty':'');
    if (_dtc[k]) return _dtc[k];

    const S = 512;
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d');

    // Couleurs selon tint
    const C={
        normal:  {border:'rgba(126,200,227,0.5)',sep:'rgba(126,200,227,0.3)',icon:'#7ec8e3',glow:'rgba(126,200,227,0.12)'},
        ice:     {border:'rgba(220,235,248,0.45)',sep:'rgba(220,235,248,0.25)',icon:'rgba(230,240,250,0.85)',glow:'rgba(220,235,248,0.1)'},
        cyan:    {border:'rgba(126,200,227,0.9)',sep:'rgba(126,200,227,0.6)',icon:'#5eefff',glow:'rgba(94,239,255,0.3)'},
        pink:    {border:'rgba(255,120,180,0.7)',sep:'rgba(255,120,180,0.4)',icon:'#ff78b4',glow:'rgba(255,120,180,0.15)'},
        silver:  {border:'rgba(34,211,238,0.6)',sep:'rgba(34,211,238,0.35)',icon:'#22d3ee',glow:'rgba(34,211,238,0.15)'},
        gold:    {border:'rgba(255,215,0,0.6)',sep:'rgba(255,215,0,0.35)',icon:'#ffd700',glow:'rgba(255,215,0,0.15)'},
        emerald: {border:'rgba(52,211,153,0.6)',sep:'rgba(52,211,153,0.35)',icon:'#34d399',glow:'rgba(52,211,153,0.15)'},
        nova:    {border:'rgba(251,146,60,0.7)',sep:'rgba(251,146,60,0.4)',icon:'#fb923c',glow:'rgba(251,146,60,0.2)'},
        plasma:  {border:'rgba(192,132,252,0.7)',sep:'rgba(192,132,252,0.4)',icon:'#c084fc',glow:'rgba(192,132,252,0.2)'},
    };
    const c=C[tint]||C.normal;
    const border=c.border, sep=c.sep, iconC=c.icon, glow=c.glow;

    // Fond arrondi
    const r = 36, m = 8;
    ctx.fillStyle = '#0e0f18';
    ctx.beginPath();
    ctx.moveTo(m+r, m); ctx.lineTo(S-m-r, m); ctx.quadraticCurveTo(S-m, m, S-m, m+r);
    ctx.lineTo(S-m, S-m-r); ctx.quadraticCurveTo(S-m, S-m, S-m-r, S-m);
    ctx.lineTo(m+r, S-m); ctx.quadraticCurveTo(m, S-m, m, S-m-r);
    ctx.lineTo(m, m+r); ctx.quadraticCurveTo(m, m, m+r, m);
    ctx.closePath(); ctx.fill();

    // Glow interne
    ctx.shadowColor = glow; ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Bordure néon
    ctx.strokeStyle = border; ctx.lineWidth = 3;
    ctx.shadowColor = border; ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;

    if(!noIcons){
        // Séparateur horizontal (médiane)
        ctx.strokeStyle = sep; ctx.lineWidth = 2.5;
        ctx.shadowColor = sep; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(m+16, S/2); ctx.lineTo(S-m-16, S/2); ctx.stroke();
        ctx.shadowBlur = 0;

        // Icônes — haut et bas
        const iconSz = S * 0.42;
        drawIcon(ctx, leftIdx,  S*0.5, S*0.25, iconSz, iconC);
        drawIcon(ctx, rightIdx, S*0.5, S*0.75, iconSz, iconC);
    }

    const tex = new THREE.CanvasTexture(cv);
    _dtc[k] = tex;
    return tex;
}

// ═══ TABLEAUX ═══

const GAP = 1.15;
const TABLEAUX = [
    { name:'T1', sats:[
        {x:-GAP, y:0, v:[0,2], state:'silver'},
        {x:GAP, y:0, v:[2,7]},
        {x:2*GAP, y:0, v:[4,6], state:'gold'},
        {x:0, y:GAP, v:[3,4], state:'plasma'},          // PLASMA — pivot !
        {x:0, y:-GAP, v:[9,0], state:'emerald'},
    ] },
    { name:'T2', sats:[
        {x:0, y:-GAP, v:[3,4], state:'silver'},
        {x:0, y:GAP, v:[4,6]},
    ] },
    { name:'T3', sats:[
        {x:-GAP, y:-GAP, v:[9,0]}, {x:-GAP, y:GAP, v:[0,5]},
        {x:GAP, y:2*GAP, v:[7,3]}, {x:0, y:2*GAP, v:[6,8]}, {x:-GAP, y:2*GAP, v:[4,1]}
    ] },
    { name:'T4', sats:[
        {x:GAP, y:-2*GAP, v:[2,9]}, {x:0, y:-2*GAP, v:[8,4], state:'gold'},
        {x:GAP, y:-GAP, v:[0,5]}, {x:GAP, y:GAP, v:[6,1]},
        {x:-GAP, y:-GAP, v:[3,7]}, {x:-GAP, y:GAP, v:[9,2]}
    ] },
];
const TOTAL = TABLEAUX.length;

// ═══ FUSION ═══

const STATE_ORDER = ['white','silver','gold','emerald','nova','plasma'];
function promoteState(st){ const i=STATE_ORDER.indexOf(st||'white'); return i<STATE_ORDER.length-1?STATE_ORDER[i+1]:st; }

// Détecte si deux sats adjacents ont des faces qui matchent
// Retourne {matchFace, percuteurFaceIdx, percutéFaceIdx} ou null
// percuteur = sat qui a bougé, percuté = sat immobile
function detectFusion(percuteur, percute){
    // Direction relative : où est le percuté par rapport au percuteur ?
    const dx = percute.lx - percuteur.lx;
    const dy = percute.ly - percuteur.ly;
    const dist = Math.hypot(dx, dy);
    if(dist > GAP*1.2 || dist < GAP*0.3) return null;

    // Dominos verticaux : value[0]=haut, value[1]=bas
    // Adjacence horizontale : percuteur.droite n'existe pas sur un domino vertical
    //   → on compare value[1] du percuteur (bas) avec value[0] du percuté (haut)
    //     OU value[0] du percuteur (haut) avec value[1] du percuté (bas)
    //   selon la direction relative

    // Dominos sur la grille : y positif = haut dans l'espace 3D
    // Sur la texture : value[0] = haut de la texture, value[1] = bas
    // Mais l'axe Y 3D : y+ = haut

    let pFace = -1, tFace = -1; // indices dans value[]

    if(Math.abs(dy) > Math.abs(dx)){
        // Adjacence verticale
        if(dy > 0){
            // percuté est AU-DESSUS du percuteur
            // bas du percuté (value[1]) face au haut du percuteur (value[0])
            pFace = 0; tFace = 1;
        } else {
            // percuté est EN-DESSOUS du percuteur
            // haut du percuté (value[0]) face au bas du percuteur (value[1])
            pFace = 1; tFace = 0;
        }
    } else {
        // Adjacence horizontale — les dominos sont verticaux
        // Face-à-face latéral : on compare les deux faces les plus proches
        // Convention : face du bas du percuteur vs face du haut du percuté
        // (car le percuteur "pousse" vers le percuté)
        // Pour l'horizontal, on prend les deux faces entières et on cherche un match
        if(percuteur.value[0] === percute.value[0]){ pFace=0; tFace=0; }
        else if(percuteur.value[0] === percute.value[1]){ pFace=0; tFace=1; }
        else if(percuteur.value[1] === percute.value[0]){ pFace=1; tFace=0; }
        else if(percuteur.value[1] === percute.value[1]){ pFace=1; tFace=1; }
        else return null;

        return { matchIcon: percuteur.value[pFace], pFace, tFace };
    }

    // Vérifier le match vertical
    if(percuteur.value[pFace] !== percute.value[tFace]) return null;
    return { matchIcon: percuteur.value[pFace], pFace, tFace };
}

// Condition de fusion : même icône ET même état (comme ADAM 2D)
function canFuse(percuteur, percute){
    const f = detectFusion(percuteur, percute);
    if(!f) return null;
    const pState = percuteur.state || 'white';
    const tState = percute.state || 'white';
    if(pState !== tState) return null;
    if(tState === 'plasma') return null; // déjà au max
    return f;
}

// Animation de fusion
let fusionAnim = null;

function performFusion(percuteur, percute, fusionInfo){
    fusionAnim = {
        percuteur, percute, fusionInfo,
        t: 0, phase: 'compress', // compress → promote → done
    };
    // Flash info
    document.getElementById('infoLine').textContent = `⚡ FUSION · ${fusionInfo.matchIcon !== undefined ? 'icône '+fusionInfo.matchIcon : ''} → ${promoteState(percute.state||'white')}`;
}

function tickFusionAnim(dt){
    if(!fusionAnim) return;
    const fa = fusionAnim;
    fa.t += dt;

    if(fa.phase === 'compress'){
        // Phase 1 : compression du percuteur (0→0.4s)
        const p = Math.min(1, fa.t / 0.4);
        const ease = 1 - Math.pow(1 - p, 3);
        const sc = 1 - ease * 0.85;
        fa.percuteur.mesh.scale.set(sc, sc, sc);
        // Pulse glow sur le percuté
        const ud = fa.percute.mesh.userData;
        ud.glowMesh.material.opacity = 0.3 + p * 0.4;
        ud.glowMesh.material.color.set(0xffffff);
        if(p >= 1){
            fa.phase = 'promote';
            fa.t = 0;
            // Cacher le percuteur
            fa.percuteur.mesh.visible = false;
            // Promouvoir le percuté
            const oldState = fa.percute.state || 'white';
            const newState = promoteState(oldState);
            fa.percute.state = newState;
            // Recalculer la face restante du percuté
            // La face qui a matché (tFace) disparaît, l'autre reste
            // La nouvelle face = celle qui reste du percuteur (l'autre face)
            const remainPercuteur = fa.percuteur.value[1 - fa.fusionInfo.pFace];
            const remainPercute = fa.percute.value[1 - fa.fusionInfo.tFace];
            fa.percute.value = [remainPercute, remainPercuteur];
            // Mettre à jour la texture
            const tint = newState !== 'white' ? newState : 'normal';
            fa.percute.mesh.userData.numMesh.material.map = getSatTex(fa.percute.value, tint, newState);
            // Marquer le percuteur comme "mort" — le retirer du tableau
            fa.percuteur.tableau = -1;
            fa.percuteur.lx = 99; fa.percuteur.ly = 99;
        }
    }
    else if(fa.phase === 'promote'){
        // Phase 2 : pulse du percuté (0→0.35s)
        const p = Math.min(1, fa.t / 0.35);
        const sc = 1 + 0.15 * Math.sin(p * Math.PI);
        fa.percute.mesh.scale.set(sc, sc, sc);
        const ud = fa.percute.mesh.userData;
        ud.glowMesh.material.opacity = 0.5 * (1 - p);
        if(p >= 1){
            fa.percute.mesh.scale.set(1,1,1);
            ud.glowMesh.material.opacity = 0;
            fusionAnim = null;
            // Vérifier les fusions en chaîne
            checkAllFusions();
            assignFaces(); refreshZoom(); updateUI();
        }
    }
}

// Vérifier toutes les paires du tableau courant pour des fusions en chaîne
function checkAllFusions(){
    const fIdx = mod(currentIdx);
    const tableSats = sats.filter(s => s.tableau === fIdx && !s.locked && s.tableau >= 0);
    for(let i = 0; i < tableSats.length; i++){
        for(let j = i+1; j < tableSats.length; j++){
            const a = tableSats[i], b = tableSats[j];
            // On ne sait pas qui est le percuteur en chaîne → le dernier promu est le percuté
            const f1 = canFuse(a, b);
            if(f1){ performFusion(a, b, f1); return; }
            const f2 = canFuse(b, a);
            if(f2){ performFusion(b, a, f2); return; }
        }
    }
}

// ═══ CONFIG ═══

const HALF = 0.52;
const CAM_Z = 18;

const CAM_Z_MIN = 8;    // zoom max (caméra au plus près)
const CAM_Z_MAX = 18;   // zoom min (caméra au plus loin)

function camTargetFor(tIdx, viewIdx){
    // viewIdx = le tableau qu'on est en train de viser (peut différer de currentIdx pendant nav)
    if(viewIdx===undefined) viewIdx=mod(currentIdx);
    // Collecter les positions de tous les sats du tableau (non locked)
    // Toujours inclure le cube central (porte) à (0,0) car il est toujours visible
    const pts=[{x:0, y:0}];
    sats.forEach(s=>{
        if(s.tableau===tIdx&&!s.locked) pts.push({x:s.lx, y:s.ly});
    });
    // Inclure la position physique du flottant si on calcule pour le tableau visé
    if(lockedSat && tIdx===viewIdx){
        const wp=new THREE.Vector3();lockedSat.mesh.getWorldPosition(wp);
        const lp=cubeGroup.worldToLocal(wp.clone());
        pts.push({x:lp.x, y:lp.y});
    }
    // Boîte englobante
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{
        minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
        minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
    });
    const cx=(minX+maxX)/2;
    const hw=(maxX-minX)/2+0.6;
    const hh=(maxY-minY)/2+0.6;
    const spread=Math.max(hw,hh)*1.2;
    const z=Math.min(CAM_Z_MAX, Math.max(CAM_Z_MIN, 1.5+spread*3.8));
    return {x:cx, z};
}
function camTargetForStatic(tIdx){
    const tab=TABLEAUX[tIdx]; if(!tab)return {x:0,z:CAM_Z};
    // Inclure le cube central
    const pts=[{x:0, y:0}];
    tab.sats.forEach(s=>pts.push({x:s.x, y:s.y}));
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{
        minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
        minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
    });
    const cx=(minX+maxX)/2;
    const hw=(maxX-minX)/2+0.6;
    const hh=(maxY-minY)/2+0.6;
    const spread=Math.max(hw,hh)*1.2;
    const z=Math.min(CAM_Z_MAX, Math.max(CAM_Z_MIN, 1.5+spread*3.8));
    return {x:cx, z};
}

let targetCamX=0;
function refreshZoom(){
    const t=camTargetFor(mod(currentIdx));
    targetCamX=t.x;targetCamZ=t.z;
}

const FACE_ROT=[0, Math.PI/2, Math.PI, -Math.PI/2];

// ═══ THREE SETUP ═══

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(600,600);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x0c0d14);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
const initCam=camTargetForStatic(0);
camera.position.set(initCam.x,0,initCam.z);camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff,0.8));

// ═══ HELPERS ═══

function rrShape(w,h,r){
    const s=new THREE.Shape(),hw=w/2,hh=h/2;
    s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);
    s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);
    s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);
    s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);
    s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;
}

function placeSat(sat,faceRotY){
    const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),faceRotY);
    sat.mesh.position.copy(new THREE.Vector3(sat.lx,sat.ly,HALF+SAT_LIFT).applyQuaternion(q));
    sat.mesh.quaternion.copy(q);
    sat.baseQuat = q.clone(); // référence pour le breathing
}

// ═══ PORTE ═══

let porteValue=[4,2];
const cubeGroup=new THREE.Group();scene.add(cubeGroup);

function makePorteTex(val){ return getDominoTex(val[0], val[1], 'ice'); }
const cubeMats=[];for(let i=0;i<6;i++)cubeMats.push(new THREE.MeshBasicMaterial({map:makePorteTex(porteValue),transparent:true}));
const cubeMesh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),cubeMats);cubeMesh.userData.isCube=true;cubeGroup.add(cubeMesh);

// Halo ice — sprite radial gradient face-caméra
const haloCanvas=document.createElement('canvas');haloCanvas.width=256;haloCanvas.height=256;
const hctx=haloCanvas.getContext('2d');
const grad=hctx.createRadialGradient(128,128,0,128,128,128);
grad.addColorStop(0,'rgba(220,235,248,0.25)');
grad.addColorStop(0.3,'rgba(200,220,240,0.12)');
grad.addColorStop(0.6,'rgba(180,210,235,0.04)');
grad.addColorStop(1,'rgba(180,210,235,0)');
hctx.fillStyle=grad;hctx.fillRect(0,0,256,256);
const haloTex=new THREE.CanvasTexture(haloCanvas);
const haloSpriteMat=new THREE.SpriteMaterial({map:haloTex,transparent:true,opacity:0.7,depthWrite:false});
const haloSprite=new THREE.Sprite(haloSpriteMat);
haloSprite.scale.set(2.8,2.8,1);
cubeGroup.add(haloSprite);

function updatePorte(val){porteValue=val;const tex=makePorteTex(val);cubeMats.forEach(m=>{m.map=tex;m.needsUpdate=true;});}

// ═══ SATELLITES — un seul plane texturé, pas de double carré ═══

const sats=[];
// Helper : texture satellite — plasma = pas d'icônes
function getSatTex(value, tint, state){
    const noIcons = (state === 'plasma');
    return getDominoTex(value[0], value[1], tint, noIcons);
}

const SAT_DEPTH = 0.06;  // épaisseur du domino
const SAT_LIFT = 0.08;   // hauteur de flottement au-dessus de la face
function createSatMesh(value,tint,state){
    const grp=new THREE.Group(), SZ=1.0, R=0.12;

    // ── Face avant (texture domino) ──
    const nMesh=new THREE.Mesh(
        new THREE.PlaneGeometry(SZ, SZ),
        new THREE.MeshBasicMaterial({map:getSatTex(value,tint||'normal',state),transparent:true})
    );
    nMesh.position.z = SAT_DEPTH/2 + 0.001; // devant la box
    grp.add(nMesh);

    // ── Corps 3D (épaisseur) ──
    const boxGeo = new THREE.BoxGeometry(SZ, SZ, SAT_DEPTH);
    const sideMat = new THREE.MeshBasicMaterial({color:0x141520, transparent:true, opacity:0.95});
    const edgeMat = new THREE.MeshBasicMaterial({color:0x7ec8e3, transparent:true, opacity:0.15});
    const backMat = new THREE.MeshBasicMaterial({color:0x0a0b12, transparent:true, opacity:0.9});
    // BoxGeometry faces: +x, -x, +y, -y, +z (front), -z (back)
    const boxMats = [sideMat, sideMat, sideMat, sideMat, edgeMat, backMat];
    const boxMesh = new THREE.Mesh(boxGeo, boxMats);
    grp.add(boxMesh);

    // ── Liseré néon sur les arêtes ──
    const edgesGeo = new THREE.EdgesGeometry(boxGeo);
    const edgeLines = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({color:0x7ec8e3, transparent:true, opacity:0.18}));
    grp.add(edgeLines);

    // ── Ombre portée (plan sombre flou derrière) ──
    const shadowCanvas = document.createElement('canvas'); shadowCanvas.width=128; shadowCanvas.height=128;
    const sctx = shadowCanvas.getContext('2d');
    const sg = sctx.createRadialGradient(64,64,10,64,64,60);
    sg.addColorStop(0,'rgba(0,0,0,0.35)');
    sg.addColorStop(0.5,'rgba(0,0,0,0.15)');
    sg.addColorStop(1,'rgba(0,0,0,0)');
    sctx.fillStyle=sg; sctx.fillRect(0,0,128,128);
    const shadowTex = new THREE.CanvasTexture(shadowCanvas);
    const shadowMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(SZ*1.25, SZ*1.25),
        new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:0.6, depthWrite:false})
    );
    shadowMesh.position.z = -SAT_DEPTH/2 - SAT_LIFT + 0.005; // collée sur la face du cube
    grp.add(shadowMesh);

    // ── Glow (derrière, pour état locked) ──
    const gShape=rrShape(SZ+0.06,SZ+0.06,R+0.03);
    const gMesh=new THREE.Mesh(new THREE.ShapeGeometry(gShape),new THREE.MeshBasicMaterial({color:0x7ec8e3,transparent:true,opacity:0}));
    gMesh.position.z=-SAT_DEPTH/2-0.005;grp.add(gMesh);
    // Halo
    const hMesh=new THREE.Mesh(new THREE.ShapeGeometry(rrShape(SZ+0.2,SZ+0.2,R+0.08)),new THREE.MeshBasicMaterial({color:0x7ec8e3,transparent:true,opacity:0}));
    hMesh.position.z=-SAT_DEPTH/2-0.01;grp.add(hMesh);

    grp.userData={numMesh:nMesh,glowMesh:gMesh,haloMesh:hMesh,boxMesh:boxMesh,edgeLines:edgeLines,shadowMesh:shadowMesh,isSat:true};
    return grp;
}

TABLEAUX.forEach((tab,tIdx)=>{tab.sats.forEach((sd,sIdx)=>{
    const st=sd.state||'white';
    const mesh=createSatMesh(sd.v,st!=='white'?st:undefined,st);mesh.visible=false;cubeGroup.add(mesh);
    sats.push({id:tIdx*100+sIdx,value:sd.v,state:st,tableau:tIdx,origTableau:tIdx,lx:sd.x,ly:sd.y,origLx:sd.x,origLy:sd.y,locked:false,mesh});
});});

// ═══ STATE ═══

let lockedSat=null,currentIdx=0,busy=false,isAnimating=false,navDir=0;
let isFlipped=false, flipDir=0; // flipDir: 1=up(flip), -1=down(unflip)
let targetCamZ=camTargetForStatic(0).z;
const targetQuat=new THREE.Quaternion();
function mod(n){return((n%TOTAL)+TOTAL)%TOTAL;}

// ═══ ASSIGN ═══

function assignFaces(){
    const faceMap=[[mod(currentIdx),0],[mod(currentIdx+1),1],[mod(currentIdx-1),3]];
    sats.forEach(sat=>{
        if(sat.locked||sat.tableau<0)return;
        const entry=faceMap.find(f=>f[0]===sat.tableau);
        if(entry){placeSat(sat,FACE_ROT[entry[1]]);if(sat.mesh.parent!==cubeGroup)cubeGroup.attach(sat.mesh);}
    });
}

// ═══ NAV ═══

// Helper: masquer tout satellite aux mêmes coordonnées que la source du locked, tous tableaux confondus
function isHiddenBySrc(s){
    return lockedSat&&!s.locked&&Math.abs(s.lx-lockedSat.srcLx)<0.2&&Math.abs(s.ly-lockedSat.srcLy)<0.2;
}

function navRight(){
    if(busy||isAnimating)return;busy=true;isAnimating=true;navDir=1;flipDir=0;
    targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),-Math.PI/2);
    const nextIdx=mod(currentIdx+1);
    const t=camTargetFor(nextIdx, nextIdx);targetCamX=t.x;targetCamZ=t.z;
    const show=[mod(currentIdx),nextIdx];
    sats.forEach(s=>{if(!s.locked&&show.includes(s.tableau))s.mesh.visible=!isHiddenBySrc(s);});
}
function navLeft(){
    if(busy||isAnimating)return;busy=true;isAnimating=true;navDir=-1;flipDir=0;
    targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);
    const nextIdx=mod(currentIdx-1);
    const t=camTargetFor(nextIdx, nextIdx);targetCamX=t.x;targetCamZ=t.z;
    const show=[mod(currentIdx),nextIdx];
    sats.forEach(s=>{if(!s.locked&&show.includes(s.tableau))s.mesh.visible=!isHiddenBySrc(s);});
}

function flipUp(){
    if(busy||isAnimating)return;busy=true;isAnimating=true;navDir=0;flipDir=1;
    // Rotation 180° autour de X — le cube se renverse vers l'arrière
    targetQuat.setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI);
    isFlipped=!isFlipped;
}
function flipDown(){
    if(busy||isAnimating)return;busy=true;isAnimating=true;navDir=0;flipDir=-1;
    // Rotation 180° autour de X — le cube se renverse vers l'avant
    targetQuat.setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI);
    isFlipped=!isFlipped;
}

function onRotationComplete(){
    if(flipDir!==0){
        // Flip terminé — reset quaternion, les sats sont déjà sur le bon tableau
        cubeGroup.quaternion.identity();targetQuat.identity();flipDir=0;
        // Inverser les valeurs Y des satellites du tableau courant (effet miroir)
        const fIdx=mod(currentIdx);
        sats.forEach(s=>{
            if(s.tableau===fIdx&&!s.locked&&s.tableau>=0){
                s.ly=-s.ly;
                // Inverser les faces du domino (haut↔bas)
                s.value=[s.value[1],s.value[0]];
                const st=s.state||'white';
                const tint=st!=='white'?st:'normal';
                s.mesh.userData.numMesh.material.map=getSatTex(s.value,tint,st);
            }
        });
        // Inverser aussi la porte
        updatePorte([porteValue[1],porteValue[0]]);
        assignFaces();isAnimating=false;busy=false;refreshZoom();updateUI();
    } else {
        currentIdx=mod(currentIdx+navDir);cubeGroup.quaternion.identity();targetQuat.identity();navDir=0;
        assignFaces();isAnimating=false;busy=false;updateUI();
    }
}

// ═══ TAP ═══

function tapLock(sat){
    if(busy||isAnimating||fusionAnim)return;if(lockedSat)tapRelease(lockedSat);
    sat.locked=true;lockedSat=sat;sat.srcTableau=sat.tableau;sat.srcLx=sat.lx;sat.srcLy=sat.ly;
    // Masquer tout satellite à la même position source (évite superposition pendant navigation)
    sats.forEach(s=>{
        if(s!==sat&&!s.locked&&s.tableau===sat.srcTableau&&Math.abs(s.lx-sat.srcLx)<0.2&&Math.abs(s.ly-sat.srcLy)<0.2)
            s.mesh.visible=false;
    });
    scene.attach(sat.mesh);refreshZoom();updateUI();
}
function tapRelease(sat){
    if(!sat.locked)return;
    if(isAnimating||busy)return;
    const wp=new THREE.Vector3();sat.mesh.getWorldPosition(wp);
    cubeGroup.attach(sat.mesh);
    const fIdx=mod(currentIdx);
    const lp=cubeGroup.worldToLocal(wp.clone());
    const lx=lp.x,ly=lp.y;
    let closest=null,cd=Infinity;
    for(const o of sats){if(o===sat||o.locked||o.tableau!==fIdx)continue;const d=Math.hypot(o.lx-lx,o.ly-ly);if(d<cd){cd=d;closest=o;}}
    if(closest&&cd<GAP*0.9){
        const cT=closest.tableau,cX=closest.lx,cY=closest.ly;
        // Vérifier fusion AVANT le swap de positions
        const fusionInfo = canFuse(sat, closest);
        if(fusionInfo){
            // Poser le percuteur à côté du percuté pour l'animation
            sat.tableau=cT; sat.lx=cX; sat.ly=cY;
            placeSat(sat, FACE_ROT[0]); sat.mesh.scale.set(1,1,1);
            sat.locked=false; lockedSat=null;
            performFusion(sat, closest, fusionInfo);
            assignFaces(); refreshZoom(); updateUI();
            return;
        }
        // Pas de fusion → swap classique
        // Le satellite flottant prend la place du closest (sur le tableau courant)
        sat.tableau=cT;sat.lx=cX;sat.ly=cY;placeSat(sat,FACE_ROT[0]);sat.mesh.scale.set(1,1,1);
        // Le closest prend la place source (peut être un autre tableau)
        closest.tableau=sat.srcTableau;closest.lx=sat.srcLx;closest.ly=sat.srcLy;
        // Restaurer visibilité du closest (il était peut-être masqué)
        closest.mesh.visible=true;
    } else {
        sat.tableau=fIdx;sat.lx=lx;sat.ly=ly;placeSat(sat,FACE_ROT[0]);sat.mesh.scale.set(1,1,1);
    }
    sat.locked=false;lockedSat=null;assignFaces();
    // Un seul mouvement de zoom : on calcule directement la cible finale (sans flottant)
    refreshZoom();updateUI();
}

// ═══ DRAG SWAP ═══

let swapAnim=null;
const ARENA_MAX = 3; // arène 7×7 → ±3*GAP

function findSatAt(fIdx, x, y){
    return sats.find(s=>!s.locked&&s.tableau===fIdx&&s.tableau>=0&&Math.abs(s.lx-x)<0.15&&Math.abs(s.ly-y)<0.15)||null;
}

// Vérifie si une position est occupée par la porte (centre 0,0)
function isPortePos(x, y){ return Math.abs(x)<0.15 && Math.abs(y)<0.15; }

function dragSwap(sat, dirX, dirY){
    if(!sat||sat.locked||busy||isAnimating||swapAnim||fusionAnim)return false;
    const fIdx=mod(currentIdx);
    if(sat.tableau!==fIdx)return false;
    const st=sat.state||'white';
    if(st==='white') return false;

    // Direction constraints
    if(st==='silver' && (dirY!==0||dirX===0)) return false;
    if(st==='emerald' && (dirX!==0||dirY===0)) return false;
    if(st==='gold' && (dirX===0||dirY===0)) return false;
    if(st==='nova' && (dirX!==0&&dirY!==0)) return false;
    if(st==='plasma' && (dirX!==0&&dirY!==0)) return false;

    // ── PLASMA : poussée en chaîne bidirectionnelle ──
    if(st==='plasma'){
        const srcX=sat.lx, srcY=sat.ly;
        const destX=srcX+dirX*GAP, destY=srcY+dirY*GAP;

        // La porte bloque : si la destination du plasma est la porte → refusé
        if(isPortePos(destX, destY)) return false;
        // Hors arène → refusé
        if(Math.abs(destX)>ARENA_MAX*GAP+0.1 || Math.abs(destY)>ARENA_MAX*GAP+0.1) return false;

        // Chaîne forward : satellites alignés devant la destination
        const chainFwd=[];
        let fx=destX, fy=destY;
        while(true){
            // La porte bloque la chaîne
            if(isPortePos(fx, fy)) break;
            const s=findSatAt(fIdx, fx, fy);
            if(!s) break;
            chainFwd.push(s);
            fx+=dirX*GAP; fy+=dirY*GAP;
        }

        // Si la chaîne forward existe, vérifier que le dernier peut sortir
        if(chainFwd.length>0){
            const last=chainFwd[chainFwd.length-1];
            const endX=last.lx+dirX*GAP, endY=last.ly+dirY*GAP;
            // Bloqué par la porte
            if(isPortePos(endX, endY)) return false;
            // Bloqué par un autre satellite
            if(findSatAt(fIdx, endX, endY)) return false;
            // Hors arène
            if(Math.abs(endX)>ARENA_MAX*GAP+0.1 || Math.abs(endY)>ARENA_MAX*GAP+0.1) return false;
        }

        // Chaîne backward : satellites alignés derrière le plasma (comblent le vide)
        const chainBwd=[];
        let bx=srcX-dirX*GAP, by=srcY-dirY*GAP;
        while(true){
            if(isPortePos(bx, by)) break;
            const s=findSatAt(fIdx, bx, by);
            if(!s) break;
            chainBwd.push(s);
            bx-=dirX*GAP; by-=dirY*GAP;
        }

        // Construire l'animation
        const pairs=[];

        // Le plasma lui-même se déplace
        pairs.push({mesh:sat.mesh, from:{x:srcX,y:srcY}, to:{x:destX,y:destY}, sat:sat});

        // Forward : chaque satellite poussé d'un cran
        chainFwd.forEach(s=>{
            pairs.push({mesh:s.mesh, from:{x:s.lx,y:s.ly}, to:{x:s.lx+dirX*GAP,y:s.ly+dirY*GAP}, sat:s});
        });

        // Backward : chaque satellite aspiré d'un cran (vers la position libérée)
        chainBwd.forEach(s=>{
            pairs.push({mesh:s.mesh, from:{x:s.lx,y:s.ly}, to:{x:s.lx+dirX*GAP,y:s.ly+dirY*GAP}, sat:s});
        });

        // Appliquer les positions logiques
        pairs.forEach(p=>{ p.sat.lx=p.to.x; p.sat.ly=p.to.y; });

        swapAnim={ pairs, t:0, isPlasma:true };
        return true;
    }

    // ── SWAP CLASSIQUE (silver, gold, emerald, nova) ──
    const tx=sat.lx+dirX*GAP, ty=sat.ly+dirY*GAP;
    // Pas de swap vers la porte
    if(isPortePos(tx, ty)) return false;
    const target=sats.find(s=>s!==sat&&!s.locked&&s.tableau===fIdx&&Math.abs(s.lx-tx)<0.2&&Math.abs(s.ly-ty)<0.2);
    if(target){
        const aFrom={x:sat.lx,y:sat.ly}, bFrom={x:target.lx,y:target.ly};
        sat.lx=bFrom.x;sat.ly=bFrom.y;target.lx=aFrom.x;target.ly=aFrom.y;
        swapAnim={pairs:[
            {mesh:sat.mesh, from:aFrom, to:bFrom},
            {mesh:target.mesh, from:bFrom, to:aFrom},
        ], t:0};
        return true;
    }
    return false;
}

function dragPorte(dirX, dirY){
    if(busy||isAnimating||swapAnim||fusionAnim)return false;
    const fIdx=mod(currentIdx);
    const tx=dirX*GAP, ty=dirY*GAP;
    const target=sats.find(s=>!s.locked&&s.tableau===fIdx&&Math.abs(s.lx-tx)<0.2&&Math.abs(s.ly-ty)<0.2);
    if(!target)return false;
    
    // Ghost porte voyage vers la position du satellite
    const ghostMesh=new THREE.Mesh(
        new THREE.PlaneGeometry(1,1),
        new THREE.MeshBasicMaterial({map:getDominoTex(porteValue[0],porteValue[1],'ice'),transparent:true})
    );
    ghostMesh.position.set(0,0,HALF+0.02);
    cubeGroup.add(ghostMesh);
    
    swapAnim={
        pairs:[{mesh:target.mesh, from:{x:target.lx,y:target.ly}, to:{x:0,y:0}}],
        ghost:ghostMesh, ghostFrom:{x:0,y:0}, ghostTo:{x:target.lx,y:target.ly},
        target:target, oldPorte:[...porteValue], oldSat:[...target.value],
        t:0, isPorteSwap:true
    };
    return true;
}

function tickSwapAnim(dt){
    if(!swapAnim)return;
    swapAnim.t+=dt*2.5;
    const p=Math.min(1, swapAnim.t);
    const ease=p<0.5?2*p*p:(1-Math.pow(-2*p+2,2)/2);
    
    if(swapAnim.isPorteSwap){
        // Satellite va vers le centre
        swapAnim.pairs.forEach(pair=>{
            pair.mesh.position.x=pair.from.x+(pair.to.x-pair.from.x)*ease;
            pair.mesh.position.y=pair.from.y+(pair.to.y-pair.from.y)*ease;
        });
        // Ghost porte va vers la position du satellite
        const g=swapAnim.ghost;
        g.position.x=swapAnim.ghostFrom.x+(swapAnim.ghostTo.x-swapAnim.ghostFrom.x)*ease;
        g.position.y=swapAnim.ghostFrom.y+(swapAnim.ghostTo.y-swapAnim.ghostFrom.y)*ease;
        g.position.z=HALF+0.02;
        
        if(p>=1){
            const target=swapAnim.target;
            updatePorte(swapAnim.oldSat);
            target.value=swapAnim.oldPorte;
            const tst=target.state||'white';
            target.mesh.userData.numMesh.material.map=getSatTex(target.value,tst!=='white'?tst:'normal',tst);
            cubeGroup.remove(swapAnim.ghost);
            swapAnim.ghost.geometry.dispose();
            swapAnim.ghost.material.dispose();
            placeSat(target,FACE_ROT[0]);
            assignFaces();swapAnim=null;refreshZoom();updateUI();
            checkAllFusions();
        }
    } else if(swapAnim.isPlasma){
        // Plasma : tous les satellites glissent simultanément
        swapAnim.pairs.forEach(pair=>{
            pair.mesh.position.x=pair.from.x+(pair.to.x-pair.from.x)*ease;
            pair.mesh.position.y=pair.from.y+(pair.to.y-pair.from.y)*ease;
        });
        if(p>=1){
            swapAnim.pairs.forEach(pair=>{
                if(pair.sat) placeSat(pair.sat,FACE_ROT[0]);
            });
            assignFaces();swapAnim=null;refreshZoom();updateUI();
            checkAllFusions();
        }
    } else {
        // Swap classique entre 2 satellites
        swapAnim.pairs.forEach(pair=>{
            pair.mesh.position.x=pair.from.x+(pair.to.x-pair.from.x)*ease;
            pair.mesh.position.y=pair.from.y+(pair.to.y-pair.from.y)*ease;
        });
        if(p>=1){
            swapAnim.pairs.forEach(pair=>{
                const sat=sats.find(s=>s.mesh===pair.mesh);
                if(sat&&!sat.locked) placeSat(sat,FACE_ROT[0]);
            });
            assignFaces();swapAnim=null;refreshZoom();updateUI();
            checkAllFusions();
        }
    }
}

// ═══ RAYCAST ═══

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function getSatAt(cx,cy){
    const r=canvas.getBoundingClientRect();mouse.x=((cx-r.left)/r.width)*2-1;mouse.y=-((cy-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse,camera);const all=[];
    sats.forEach(s=>{if(s.mesh.visible)s.mesh.traverse(c=>{if(c.isMesh)all.push(c);});});
    for(const h of raycaster.intersectObjects(all,false)){let o=h.object;while(o){if(o.userData&&o.userData.isSat){const s=sats.find(x=>x.mesh===o);if(s)return s;}o=o.parent;}}return null;
}

function isCubeAt(cx,cy){
    const r=canvas.getBoundingClientRect();mouse.x=((cx-r.left)/r.width)*2-1;mouse.y=-((cy-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObject(cubeMesh,false);
    return hits.length>0;
}

// ═══ POINTER — tactile + souris ═══

let pStart=null,pMoved=false,pSat=null,pCube=false,pId=null;

canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    pStart={x:e.clientX,y:e.clientY};
    pMoved=false;
    pSat=getSatAt(e.clientX,e.clientY);
    pCube=!pSat&&isCubeAt(e.clientX,e.clientY);
    pId=e.pointerId;
    canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
    if(!pStart||e.pointerId!==pId)return;
    e.preventDefault();
    if(Math.hypot(e.clientX-pStart.x,e.clientY-pStart.y)>8)pMoved=true;
});

canvas.addEventListener('pointerup',e=>{
    if(!pStart||e.pointerId!==pId)return;
    e.preventDefault();
    const dx=e.clientX-pStart.x,dy=e.clientY-pStart.y,dist=Math.hypot(dx,dy);
    const adx=Math.abs(dx),ady=Math.abs(dy);

    if(!pMoved){
        // Tap
        const sat=getSatAt(e.clientX,e.clientY);
        if(sat){if(sat.locked)tapRelease(sat);else tapLock(sat);}
        else if(lockedSat)tapRelease(lockedSat);
    } else if(dist>=20){
        // Swipe détecté — seuil 20px pour tactile
        const isHorizontal = adx > ady * 1.2;
        const isVertical   = ady > adx * 1.2;

        // Swipe depuis la porte
        if(pCube){
            let dirX=0,dirY=0;
            if(isHorizontal){dirX=dx>0?1:-1;}
            else if(isVertical){dirY=dy>0?-1:1;}
            if(dirX||dirY){
                if(dragPorte(dirX,dirY)){pStart=null;pSat=null;pCube=false;pId=null;return;}
            }
        }
        // Swipe depuis un satellite (swap entre sats si non-white)
        if(pSat&&!pSat.locked){
            let dirX=0,dirY=0;
            const st=pSat.state||'white';
            if(st==='gold'){
                dirX=dx>0?1:-1;
                dirY=dy>0?-1:1;
            } else {
                if(isHorizontal){dirX=dx>0?1:-1;}
                else if(isVertical){dirY=dy>0?-1:1;}
            }
            if(dirX||dirY){
                if(dragSwap(pSat,dirX,dirY)){pStart=null;pSat=null;pCube=false;pId=null;return;}
            }
        }
        // Swipe libre (pas sur sat/porte) → navigation ou flip
        if(isHorizontal){
            dx>0?navRight():navLeft();
        } else if(isVertical){
            dy<0?flipUp():flipDown();
        }
    }
    pStart=null;pSat=null;pCube=false;pId=null;
});

canvas.addEventListener('pointercancel',()=>{pStart=null;pSat=null;pCube=false;pId=null;});

// Empêcher le scroll / zoom navigateur sur le canvas (iOS Safari)
canvas.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();},{passive:false});

// ═══ WHEEL + TRACKPAD ═══

let wxH=0,wxV=0,wcd=false,wt=null;
canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    if(wcd||busy||isAnimating)return;

    // Séparer les axes — trackpad envoie deltaX + deltaY
    wxH+=e.deltaX;
    wxV+=e.deltaY;
    clearTimeout(wt);wt=setTimeout(()=>{wxH=0;wxV=0;},120);

    // Axe dominant
    if(Math.abs(wxH)>50 && Math.abs(wxH)>Math.abs(wxV)){
        wxH>0?navRight():navLeft();
        wxH=0;wxV=0;wcd=true;setTimeout(()=>{wcd=false;},600);
    } else if(Math.abs(wxV)>50 && Math.abs(wxV)>=Math.abs(wxH)){
        wxV>0?flipDown():flipUp();
        wxH=0;wxV=0;wcd=true;setTimeout(()=>{wcd=false;},600);
    }
},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){navRight();e.preventDefault();}else if(e.key==='ArrowLeft'){navLeft();e.preventDefault();}else if(e.key==='ArrowUp'){flipUp();e.preventDefault();}else if(e.key==='ArrowDown'){flipDown();e.preventDefault();}});

// ═══ UI ═══

const dotsEl=document.getElementById('navDots');
for(let i=0;i<TOTAL;i++){const d=document.createElement('div');d.className='nav-dot'+(i===0?' active':'');dotsEl.appendChild(d);}
function updateUI(){
    const idx=mod(currentIdx);
    const flipTag=isFlipped?' ⟳':'';
    document.getElementById('faceLabel').textContent=`${idx+1} / ${TOTAL}${flipTag}`;
    dotsEl.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
    const c=sats.filter(s=>s.tableau===idx&&!s.locked).length;
    let t=`T${idx+1} [porte] · ${c} sat${c>1?'s':''}`;
    if(isFlipped)t+=` · retourné`;
    if(lockedSat)t+=` · ⟐ flotte`;
    document.getElementById('infoLine').textContent=t;
}

// ═══ RESET ═══

document.getElementById('btnReset').addEventListener('click',()=>{
    if(lockedSat){cubeGroup.attach(lockedSat.mesh);lockedSat.locked=false;}lockedSat=null;
    let si=0;TABLEAUX.forEach((tab,tIdx)=>{tab.sats.forEach(sd=>{
        const sat=sats[si++];sat.value=[...sd.v];sat.state=sd.state||'white';sat.tableau=tIdx;sat.origTableau=tIdx;
        sat.lx=sd.x;sat.ly=sd.y;sat.origLx=sd.x;sat.origLy=sd.y;sat.locked=false;
        if(sat.mesh.parent!==cubeGroup)cubeGroup.attach(sat.mesh);sat.mesh.scale.set(1,1,1);
        const ud=sat.mesh.userData;ud.glowMesh.material.opacity=0;ud.haloMesh.material.opacity=0;
        const tint=(sat.state!=='white')?sat.state:'normal';
        ud.numMesh.material.map=getSatTex(sd.v,tint,sat.state);
    });});
    updatePorte([4,2]);cubeGroup.quaternion.identity();targetQuat.identity();
    currentIdx=0;isAnimating=false;busy=false;navDir=0;flipDir=0;isFlipped=false;
    refreshZoom();camera.position.set(targetCamX,0,targetCamZ);assignFaces();updateUI();
});

// ═══ EXPORT JSON ═══

document.getElementById('btnExport').addEventListener('click',()=>{
    const data={tableaux:[]};
    // Regrouper les sats par tableau
    const groups={};
    sats.forEach(s=>{
        if(!groups[s.tableau]) groups[s.tableau]=[];
        const entry={x:Math.round(s.lx*100)/100, y:Math.round(s.ly*100)/100, v:[...s.value]};
        if(s.state&&s.state!=='white') entry.state=s.state;
        groups[s.tableau].push(entry);
    });
    // Trier par index de tableau
    const keys=Object.keys(groups).map(Number).sort((a,b)=>a-b);
    keys.forEach(k=>{
        data.tableaux.push({name:'T'+(k+1), sats:groups[k]});
    });
    data.porte=[...porteValue];
    const json=JSON.stringify(data,null,2);
    // Copier dans le presse-papier
    navigator.clipboard.writeText(json).then(()=>{
        document.getElementById('infoLine').textContent='JSON copié !';
        setTimeout(updateUI,1500);
    }).catch(()=>{
        // Fallback: prompt
        prompt('JSON exporté :', json);
    });
});

// ═══ AXE CENTRAL ═══

document.getElementById('btnCenter').addEventListener('click',()=>{
    const el=document.getElementById('centerLine');
    el.style.display=el.style.display==='none'?'block':'none';
});

// ═══ RENDER ═══

const clock=new THREE.Clock();
let lastTime=0;
let flipProgress=0; // 0→1 pour l'animation de flip
function animate(){
    requestAnimationFrame(animate);const t=clock.getElapsedTime();const dt=t-lastTime;lastTime=t;
    if(isAnimating){
        if(flipDir!==0){
            // Animation de flip — interpolation d'angle sur X
            flipProgress=Math.min(1, flipProgress+dt*1.8);
            const ease=flipProgress<0.5?2*flipProgress*flipProgress:(1-Math.pow(-2*flipProgress+2,2)/2);
            const angle=ease*Math.PI*flipDir;
            cubeGroup.quaternion.setFromAxisAngle(new THREE.Vector3(1,0,0), angle);
            if(flipProgress>=1){cubeGroup.quaternion.copy(targetQuat);flipProgress=0;onRotationComplete();}
        } else {
            // Nav classique — slerp
            cubeGroup.quaternion.slerp(targetQuat,0.12);
            if(1-Math.abs(cubeGroup.quaternion.dot(targetQuat))<0.0001){cubeGroup.quaternion.copy(targetQuat);onRotationComplete();}
        }
    }
    tickSwapAnim(dt);
    tickFusionAnim(dt);
    // Halo ice pulse
    const hp=0.5+0.5*Math.sin(t*1.8);
    haloSpriteMat.opacity=0.4+hp*0.35;
    camera.position.x+=(targetCamX-camera.position.x)*0.08;
    camera.position.z+=(targetCamZ-camera.position.z)*0.08;
    camera.lookAt(camera.position.x, 0, 0);
    const fIdx=mod(currentIdx);
    // Trouver le satellite sous le flottant (le plus proche sur le tableau courant)
    let hoveredSat=null;
    if(lockedSat){
        const wp=new THREE.Vector3();lockedSat.mesh.getWorldPosition(wp);
        const lp=cubeGroup.worldToLocal(wp.clone());
        let bestD=GAP*0.9, bestS=null;
        sats.forEach(s=>{
            if(s===lockedSat||s.locked||s.tableau!==fIdx)return;
            const d=Math.hypot(s.lx-lp.x,s.ly-lp.y);
            if(d<bestD){bestD=d;bestS=s;}
        });
        hoveredSat=bestS;
    }
    sats.forEach((sat,si)=>{const ud=sat.mesh.userData;
        // Satellite mort (fusionné) → toujours invisible
        if(sat.tableau<0){ sat.mesh.visible=false; return; }
        // ── Micro-tilt respiration (chaque domino a un offset unique) ──
        if(sat.mesh.visible && !sat.locked && !isAnimating && !swapAnim && sat.baseQuat){
            const phase = t*1.2 + si*1.7;
            const tiltX = Math.sin(phase) * 0.012;
            const tiltY = Math.cos(phase*0.7) * 0.008;
            const breathQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(tiltX, 0, tiltY));
            sat.mesh.quaternion.copy(sat.baseQuat).multiply(breathQ);
        }
        if(sat.locked){sat.mesh.visible=true;const p=0.5+0.5*Math.sin(t*3.5);
            ud.glowMesh.material.opacity=0.2+p*0.35;ud.haloMesh.material.opacity=0.05+p*0.1;
            ud.numMesh.material.map=getSatTex(sat.value,'cyan',sat.state);
            ud.edgeLines.material.color.set(0x5eefff);ud.edgeLines.material.opacity=0.35;
        } else {
            // Masquer si position source OU si sous le flottant
            if(isHiddenBySrc(sat)||sat===hoveredSat){sat.mesh.visible=false;}
            else if(!isAnimating){sat.mesh.visible=(sat.tableau===fIdx);}
            ud.glowMesh.material.opacity=0;ud.haloMesh.material.opacity=0;
            const st=sat.state||'white';
            let tint=(st!=='white'?st:'normal');
            ud.numMesh.material.map=getSatTex(sat.value,tint,st);
            // Edge color matches state
            const eCol = st==='silver'?0x22d3ee : st==='gold'?0xffd700 : st==='emerald'?0x34d399 : st==='nova'?0xfb923c : st==='plasma'?0xc084fc : 0x7ec8e3;
            ud.edgeLines.material.color.set(eCol);
            ud.edgeLines.material.opacity=0.18;
        }
    });
    renderer.render(scene,camera);
}
assignFaces();updateUI();animate();
</script>
